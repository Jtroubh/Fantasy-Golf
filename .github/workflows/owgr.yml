name: Update world rankings
on:
  schedule:
    - cron: '27 6 * * *'   # nightly, ~1:27 AM ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/update_owgr.py
      - name: Commit if changed
        run: |
          if git diff --quiet owgr.json; then echo "No change"; exit 0; fi
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add owgr.json
          git commit -m "Update world rankings"
          git push
