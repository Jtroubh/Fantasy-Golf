<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#2c6748"/><path d="M13 7v20" stroke="#fff" stroke-width="2"/><path d="M14 7l9 3.5-9 3.5z" fill="#b48a2c"/><ellipse cx="17" cy="27" rx="7" ry="2" fill="#163a27"/></svg>
    <div><h1 id="lgName">Fantasy Golf</h1><div class="sub"><span id="whoami">Loading…</span> <a href="#" data-a="signOut" id="soLink" style="color:inherit;opacity:.7;margin-left:6px;font-size:12px" hidden>Sign out</a></div></div>
  </div>
  <div class="acting" id="acting"></div>
</header>
<nav id="tabs"></nav>
<main id="main"><div class="empty">Loading league…</div></main>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" data-import="1" style="display:none">

<script>
/* ================= Pure scoring logic ================= */
const Scoring = {
  genPoints(N){
    if(N<=1) return [10];
    const top=2*N, out=[];
    for(let i=0;i<N;i++) out.push(Math.max(1,Math.round(1+(top-1)*Math.pow((N-1-i)/(N-1),1.2))));
    return out;
  },
  parse(v){
    if(v==null) return undefined;
    const s=String(v).trim().toUpperCase();
    if(!s) return undefined;
    if(['MC','CUT','WD','DQ','MDF'].includes(s)) return 'MC';
    if(s==='E'||s==='EVEN') return 0;
    const n=Number(s.replace(/^\+/,''));
    return isNaN(n)?undefined:n;
  },
  /* teams: [{tid, starters:[names]}]; scores: {name: number|'MC'}; pts: [..]; returns rows w/ place, pts, mvp */
  compute(teams,scores,pts,{count=4,mc=8,final=false,slots=6,hasScores:hs}={}){
    const hasScores=hs!=null?hs:Object.keys(scores||{}).length>0;
    const rows=teams.map(t=>{
      const starters=t.starters.map(name=>{
        const raw=scores?.[name]; let eff=null;
        if(typeof raw==='number') eff=raw; else if(raw==='MC'||final) eff=mc;
        return {name,raw,eff,mvp:0,counts:false};
      });
      while(starters.length<slots) starters.push({name:'No golfer picked',empty:true,raw:null,eff:(hasScores||final)?mc:null,mvp:0,counts:false});
      starters.sort((a,b)=>(a.eff??1e9)-(b.eff??1e9));
      const scored=starters.filter(s=>s.eff!=null);
      const n=Math.min(count,scored.length);
      scored.forEach((s,k)=>s.counts=k<count);
      const total=n?scored.slice(0,n).reduce((a,x)=>a+x.eff,0):null;
      return {tid:t.tid,starters,total,partial:n>0&&n<count,place:null,tied:false,pts:0,mvp:{}};
    });
    if(!hasScores) return {rows,ranked:rows,hasScores:false};
    // Tiebreakers on equal totals: 5th-best golfer, then 6th-best, then best, 2nd, 3rd, 4th (lower score wins)
    const TB=[4,5,0,1,2,3];
    rows.forEach(r=>{r.tb=TB.map(k=>{const s=r.starters[k];return s&&s.eff!=null?s.eff:1e9;});});
    const cmp=(a,b)=>{const d=(a.total??1e9)-(b.total??1e9);if(d)return d;for(let k=0;k<TB.length;k++){const e=a.tb[k]-b.tb[k];if(e)return e;}return 0;};
    const ranked=[...rows].sort(cmp);
    let i=0;
    while(i<ranked.length){
      if(ranked[i].total==null) break;
      let j=i; while(j+1<ranked.length&&cmp(ranked[j+1],ranked[i])===0) j++;
      const size=j-i+1;
      const slot=k=>{let s=0;for(let q=i;q<=j;q++) s+=(pts[q+k]||0);return s/size;}; // tied teams share slots
      for(let r=i;r<=j;r++){
        const row=ranked[r]; row.place=i+1; row.tied=size>1; row.pts=slot(0);
        const sc=row.starters.filter(s=>s.eff!=null);
        let a=0;
        while(a<sc.length&&a<count){
          let b=a; while(b+1<sc.length&&sc[b+1].eff===sc[a].eff) b++;
          let val=0; for(let k=a;k<=Math.min(b,count-1);k++) val+=slot(k);
          const each=val/(b-a+1);
          for(let k=a;k<=b;k++){ if(sc[k].empty) continue; sc[k].mvp=each; row.mvp[sc[k].name]=each; }
          a=b+1;
        }
      }
      i=j+1;
    }
    return {rows,ranked,hasScores:true};
  }
};
if(typeof module!=='undefined') module.exports=Scoring;
</script>

<script>

async function tryImport(){
  if(!IMPORT||!S.ready||!db)return;

  if(imp.s==='STATUS_SCHEDULED'){toast(`${imp.e} hasn't started yet — no scores to send`);render();return;}
  const today=etYmd(Date.now()),cands=allTours().filter(t=>t.status!=='final'&&t.date).sort((a,b)=>(used(b)-used(a)));
  const nm=norm(imp.e);
  let t=cands.find(t=>nm.includes(norm(t.name))||norm(t.name).includes(nm))||cands.find(t=>t.date<=today&&addDays(t.endDate||t.date,1)>=today);
  if(!t){toast(`No league event matches "${imp.e}"`);render();return;}
  const cut=imp.p.some(r=>(r[2]||[])[2]>0);
  const scores={},holes={};let worst=null;
  imp.p.forEach(([n,sc,rh])=>{const h=(rh||[]).reduce((a,b)=>a+(+b||0),0);holes[n]=h;
    const num=sc==='E'?0:parseInt(sc,10);const mc=cut&&!((rh||[])[2]>0);
    if(mc||isNaN(num))scores[n]='MC';else{scores[n]=num;if(cut&&(worst==null||num>worst))worst=num;}});
  const upd={scores,holes,scoresUpdated:Date.now(),scoresSource:'ESPN (bookmark)'};if(cut&&worst!=null)upd.cutScore=worst;
  await w(()=>db.doc('tournaments/'+t.id).update(upd),`Scores updated from ESPN: ${t.name} (${imp.p.length} players)`);
  render();
}

// League rank: average strokes beaten vs the field in completed league events (majors/signature weighted), min 2 events
const LRC={key:null,map:null,list:[]};
function leagueRanks(){
  const ev=tours().filter(t=>used(t)&&t.status==='final'&&Object.keys(t.scores||{}).length);
  const key=ev.map(t=>t.id+':'+(t.scoresUpdated||0)).join('|');
  if(LRC.key===key&&LRC.map)return LRC;
  const acc={};
  for(const t of ev){const cs=cutScore(t),wt=evMult(t);
    const vals=Object.entries(t.scores).map(([n,v])=>[n,v==='MC'?cs:(typeof v==='number'?v:null)]).filter(x=>x[1]!=null);
    if(vals.length<10)continue;const avg=vals.reduce((a,x)=>a+x[1],0)/vals.length;
    for(const [n,v] of vals){const a=acc[n]||(acc[n]={n,sum:0,w:0,ev:0});a.sum+=(avg-v)*wt;a.w+=wt;a.ev++;}}
  const rows=Object.values(acc).map(a=>({n:a.n,tot:a.sum,avg:a.sum/a.w,ev:a.ev}));
  // League rank = total weighted strokes beaten vs the field (rewards playing well more often)
  const ranked=[...rows].sort((a,b)=>b.tot-a.tot);
  ranked.forEach((r,i)=>{r.rank=(i&&Math.abs(ranked[i-1].tot-r.tot)<1e-9)?ranked[i-1].rank:i+1;});
  // Avg rank = average per event, min 2 events (once there are 2+ league events)
  const minEv=Math.min(2,ev.length);const aranked=rows.filter(r=>r.ev>=minEv).sort((a,b)=>b.avg-a.avg);
  aranked.forEach((r,i)=>{r.arank=(i&&Math.abs(aranked[i-1].avg-r.avg)<1e-9)?aranked[i-1].arank:i+1;});
  LRC.atotal=aranked.length;
  const all={};rows.forEach(r=>all[r.n]=r);
  LRC.key=key;LRC.map=lookup(all);LRC.list=ranked;LRC.total=ranked.length;LRC.events=ev.length;LRC.minEv=minEv;return LRC;}

    }

}

const PO_KEYS=['r1','r2','r3'];
function poCfg(){const c=ST().playoffs;return c&&c.enabled&&c.r1?c:null;}
function poStageKey(id){const c=poCfg();if(!c)return null;return PO_KEYS.find(k=>c[k]===id)||null;}
function poLabel(k){const c=poCfg(),t=c&&S.tours[c[k]];return t?t.name:({r1:'Round 1',r2:'Round 2',r3:'Championship'})[k];}
function poDefaults(N){
  const n1=N<=5?Math.max(2,N-1):Math.ceil(N*0.6),n2=Math.max(2,n1<=4?n1-1:n1-2),n3=Math.max(2,n2-1);

  return {enabled:false,n1,n2,n3,p1:gp(n1),p2:gp(n2),p3:gp(n3),carry:true,r1:fx(/st\.?\s*jude/i),r2:fx(/^bmw/i),r3:fx(/tour championship/i)};
}
let _poCache=null;
function playoffState(){
  if(_poCache) return _poCache;
  const c=poCfg(); if(!c){_poCache=null;return null;}
  const ev1=S.tours[c.r1], startDate=ev1&&ev1.date||'9999';
  const pids=new Set(PO_KEYS.map(k=>c[k]).filter(Boolean));
  const reg=tours().filter(t=>t.status==='final'&&!pids.has(t.id)&&(t.date||'')<startDate);
  const regPts={},wins={};order().forEach(id=>{regPts[id]=0;wins[id]=0;});
  reg.forEach(t=>rawCompute(t,order(),tourPts(t)).rows.forEach(r=>{regPts[r.tid]=(regPts[r.tid]||0)+r.pts;if(r.place===1)wins[r.tid]++;}));
  const oi=id=>order().indexOf(id);
  const seeds=order().slice().sort((a,b)=>(regPts[b]-regPts[a])||(wins[b]-wins[a])||(oi(a)-oi(b)));
  if(c.format==='bracket'){_poCache=bracketState(c,reg,regPts,wins,seeds);return _poCache;}
  const cum={};order().forEach(id=>cum[id]=c.carry!==false?regPts[id]:0);
  const stages=[];let teams=seeds.slice(0,c.n1),projected=false;
  PO_KEYS.forEach((k,i)=>{
    const ev=S.tours[c[k]]||null,n=+c['n'+(i+1)];
    const sg={key:k,ev,n,teams:teams?teams.slice(0,n):null,projected,pts:(c['p'+(i+1)]||[]).map(Number),result:null,done:!!ev&&ev.status==='final',advance:null,auto:[]};
    if(sg.teams&&ev&&Object.keys(ev.scores||{}).length){
      const r=rawCompute(ev,sg.teams,sg.pts);sg.result=r;
      if(r.hasScores){r.rows.forEach(x=>cum[x.tid]=(cum[x.tid]||0)+x.pts);}
    }
    sg.cum={...cum};
    stages.push(sg);
    if(i<2){
      const nn=+c['n'+(i+2)];
      if(sg.result&&sg.result.hasScores){
        const place={};sg.result.rows.forEach(x=>place[x.tid]=x.place??99);
        const winners=sg.teams.filter(t=>place[t]===1).sort((a,b)=>cum[b]-cum[a]).slice(0,nn);

function bracketState(c,reg,regPts,wins,seeds){

function season(){

    const cs=e.competitions[0].competitors||[];
    const state=e.status?.type?.state; // pre | in | post
    const holesOf=c=>(c.linescores||[]).reduce((a,r)=>a+((r.linescores||[]).length),0);
    const cut=cs.some(c=>((c.linescores||[])[2]?.linescores||[]).length>0);
    const pos={};
    for(const c of cs){const n=c.athlete?.displayName;if(!n)continue;const L=c.linescores||[];let ri=-1;for(let i=0;i<L.length;i++)if((L[i].linescores||[]).length)ri=i;
      if(ri<0)continue;const hs=L[ri].linescores.map(h=>+h.period).filter(Boolean);const last=hs[hs.length-1];
      pos[n]={r:ri+1,h:hs.length>=18?last:(last%18)+1};}
    LIVE.pos=lookup(pos);LIVE.posEv=t.id;
    const scores={},holes={};let worst=null;
    for(const c of cs){const n=c.athlete?.displayName;if(!n)continue;const h=holesOf(c);if(h>0||state==='post')holes[n]=h;
      if(h===0&&state!=='post')continue;
      const mc=cut&&!(((c.linescores||[])[2]?.linescores||[]).length>0);
      const v=c.score==='E'?0:parseInt(c.score,10);
      if(mc||isNaN(v))scores[n]='MC';else{scores[n]=v;if(cut&&(worst==null||v>worst))worst=v;}}
    const upd={};
    if(Object.keys(scores).length){upd.scores=scores;upd.holes=holes;upd.scoresUpdated=Date.now();upd.scoresSource='ESPN live';if(cut&&worst!=null)upd.cutScore=worst;}
    // field + tee times
    const fld={...(t.field||{})};let fch=false;
    for(const c of cs){const n=c.athlete?.displayName;if(!n)continue;const tt=espnTee(c);if(!(n in fld)||(tt&&fld[n]!==tt)){fld[n]=tt||fld[n]||'';fch=true;}}
    if(fch&&cs.length>=30){upd.field=fld;upd.fieldUpdated=Date.now();upd.fieldSource='ESPN live';}
    if(!Object.keys(upd).length)return;
    S.tours[t.id]={...S.tours[t.id],...upd};LIVE.at=Date.now();scheduleRender();
    const sig=JSON.stringify([upd.scores,upd.holes,upd.cutScore,!!upd.field]);
    if(canWrite&&LIVE.lastSave[t.id]?.sig!==sig&&Date.now()-(LIVE.lastSave[t.id]?.at||0)>60000){
      LIVE.lastSave[t.id]={sig,at:Date.now()};
      db.doc('tournaments/'+t.id).update(upd).catch(()=>{});
    }
  }catch(err){}finally{LIVE.busy=false;}
}
function startLive(){if(LIVE.timer)return;livePoll();LIVE.timer=setInterval(livePoll,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)livePoll();});}

  db.collection('roster').onSnapshot(q=>{S.roster={};q.docs.forEach(d=>{const x=d.data();if(x&&x.teamId)S.roster[d.id]={...x,id:d.id}});mark('roster');setTimeout(sweepClaims,1500);},onErr);

function tradeProblems(x,stage){const out=[];
  const onT=(n,tid)=>{const r=S.roster[slug(n)];return r&&r.teamId===tid;};
  (x.give||[]).forEach(n=>{if(!onT(n,x.from))out.push(`${n} is no longer on ${teamName(x.from)}`);else if(tradeLocked(n))out.push(`${n} has already teed off this week`);});

let _mkCache;
function poMarks(){if(_mkCache!==undefined)return _mkCache;_mkCache=_poMarks();return _mkCache;}
function _poMarks(){
  const po=playoffState();if(!po)return null;
  const c=po.cfg,ids=order(),n1=po.bracket?Math.min(8,+c.n1):+c.n1,n2=+c.n2,n3=+c.n3;
  const ev1=S.tours[c.r1],pids=new Set(PO_KEYS.map(k=>c[k]));
  const rem=tours().filter(t=>!pids.has(t.id)&&t.status!=='final'&&(t.date||'')<((ev1&&ev1.date)||'9999'));
  const maxReg=rem.reduce((s,t)=>s+(tourPts(t)[0]||0),0),regOver=!rem.length;
  const P=po.regPts,M={};ids.forEach(id=>M[id]={});
  // x / e for making the playoffs
  ids.forEach(id=>{
    if(regOver){if(po.seeds.indexOf(id)<n1)M[id].x=1;else M[id].e=1;return;}
    const canPass=ids.filter(j=>j!==id&&P[j]+maxReg>=P[id]).length,surely=ids.filter(j=>j!==id&&P[j]>P[id]+maxReg).length;
    if(canPass<n1)M[id].x=1;if(surely>=n1)M[id].e=1;
  });
  const [s1,s2,s3]=po.stages;
  if(po.bracket){
    po.stages.forEach(sg=>{if(!sg.done)return;sg.matches.forEach(m=>{if(m.a&&m.b&&m.winner){const l=m.winner===m.a?m.b:m.a;M[l].e=1;}});});
  } else {
    const carry=c.carry!==false,p1=(c.p1||[]).map(Number),p2=(c.p2||[]).map(Number);
    const min=a=>a.length?Math.min(...a):0,max=a=>a.length?Math.max(...a):0;
    // y: clinched Round 2
    if(s1.done&&s1.advance){ids.forEach(id=>{if(s1.advance.includes(id))M[id].y=1;else M[id].e=1;});}
    else ids.forEach(id=>{if(!M[id].x)return;
      const xmin=(carry?P[id]:0)+min(p1);
      const C=ids.filter(j=>j!==id&&!M[j].e&&(carry?P[j]+maxReg:0)+max(p1)>=xmin).length;
      if(C<=n2-2)M[id].y=1;});
    // z: clinched Championship
    if(s2.done&&s2.advance){ids.forEach(id=>{if(s2.advance.includes(id))M[id].z=1;else if(M[id].y||s1.done)M[id].e=1;});}
    else ids.forEach(id=>{if(!M[id].y)return;
      const known=s1.done?s1.cum:null;
      const base=j=>known?known[j]:(carry?P[j]:0);
      const alive=j=>s1.done?(s1.advance||[]).includes(j):!M[j].e;
      const xmin=base(id)+(s1.done?0:min(p1))+min(p2);
      const C=ids.filter(j=>j!==id&&alive(j)&&base(j)+(s1.done?0:maxReg+max(p1))+max(p2)>=xmin).length;
      if(C<=n3-2)M[id].z=1;});
  }
  if(s3.done&&po.champ.length){ids.forEach(id=>{if(po.champ.includes(id))M[id].c=1;else if(M[id].z||(s3.teams||[]).includes(id))M[id].e=1;});}
  ids.forEach(id=>{const m=M[id];if(m.c)m.e=0;if(m.e){m.x=m.x&&0;}});
  return M;
}

function draftable(n){const x=newsOf(n);if(x&&x.status==='majors')return true;if(x&&x.status==='nopga')return false;if(rkOf(n)?.am)return false;return !notPGA(n);}

function golferRow(x,btn){return `<div class="it"><span>${RK.list.length?rkTag(x.n):`<span class="rank">${x.i+1}</span>`} ${pn(x.n)}</span>${btn||''}</div>`;}

    head=`<div class="card"><h2>Draft complete</h2><p class="muted">All ${T*R} picks are in. Free agency is open.</p>${isComm&&st!=='done'?'<button class="ghost" data-a="finishDraft">Mark draft finished</button>':''}</div>`;

      <div class="row">${st==='setup'?'<span class="badge">Paused</span>':''}${mine&&st==='live'?'<span class="badge me">Your pick</span>':''}${isComm&&picks.length?'<button class="ghost sm" style="color:#fff;border-color:#fff" data-a="undoPick">Undo last pick</button>':''}${isComm?'<button class="ghost sm" style="color:#fff;border-color:#fff" data-a="autoDraft">Auto-draft the rest</button>':''}</div></div>`;

      ${Array.from({length:R},(_,r)=>`<tr><th>${r+1}${r%2?' ←':' →'}</th>${o.map((id,c)=>{const idx=r*T+(r%2===0?c:T-1-c);const p=byPick[idx];return `<td class="${idx===n&&!done?'cur':''} ${id===mt&&p?'mine':''}">${p?pn(p.name):`<span class="muted small">#${idx+1}</span>`}</td>`}).join('')}</tr>`).join('')}

function waiverClears(n){const d=S.waiv[slug(n)];return d&&Date.now()<nextRunAfter(d.droppedAt)?nextRunAfter(d.droppedAt):nextRunAfter(Date.now());}
function weekEvent(){
  const now=Date.now(),win=t=>{if(!t.date)return false;const s=etDate(t.date,0,0).getTime(),e=etDate(t.endDate||t.date,23,59).getTime();return now>=s-5*864e5&&now<=e+864e5;};
  const c=allTours().filter(t=>t.status!=='final'&&fieldOf(t)&&win(t));
  return c.sort((a,b)=>(used(b)-used(a))||(a.date||'').localeCompare(b.date||''))[0]||null;
}

document.addEventListener('change',async e=>{

      for(const [c,docs] of Object.entries(C))for(const [id,d] of Object.entries(docs||{})){if(c==='league'&&id==='admins')continue;jobs.push([c+'/'+id,d]);}

      let done=0;const msg=$('#impMsg');
      for(let i=0;i<jobs.length;i+=20){await Promise.all(jobs.slice(i,i+20).map(([path,d])=>db.doc(path).set(d)));done=Math.min(jobs.length,i+20);if(msg)msg.textContent=`${done} / ${jobs.length} imported…`;}

function trendSvg(rows,mode){
  const pts=rows.filter(r=>r.hasScores&&(r.v!==undefined)).map(r=>({r,y:mode==='pos'?(r.mc?null:r.pos):(r.mc?null:r.toPar)}));
  if(!pts.length)return '<div class="muted small" style="padding:18px 0">No finishes yet — the chart fills in as league events are played.</div>';
  const W=500,H=200,L=40,R=34,T=14,B=34,ys=pts.filter(p=>p.y!=null).map(p=>p.y);
  let lo,hi;if(mode==='pos'){lo=1;hi=Math.max(10,...ys,1);}else{lo=Math.min(-5,...ys);hi=Math.max(5,...ys);}
  const cutY=mode==='pos'?hi*1.08+2:hi+2;
  const X=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);
  const Y=v=>T+(v-lo)/((cutY)-lo)*(H-T-B);
  const ticks=(mode==='pos'?[1,Math.round(hi/2),Math.round(hi)]:[lo,0,hi]).filter((v,i,a)=>a.indexOf(v)===i);
  const pathPts=pts.map((p,i)=>[X(i),p.y==null?Y(cutY):Y(p.y)]);
  const lab=p=>p.r.mc?'MC':mode==='pos'?(p.r.tied?'T':'')+p.r.pos:fmt(p.r.toPar);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Trend of past finishes">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${mode==='pos'?(v===1?'1st':v):fmt(v)}</text>`).join('')}
   <line x1="${L}" x2="${W-R}" y1="${Y(cutY)}" y2="${Y(cutY)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(cutY)+4}" text-anchor="end" font-size="11" fill="var(--muted)">MC</text>
   <polyline points="${pathPts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<g><circle cx="${X(i)}" cy="${pathPts[i][1]}" r="5" fill="${p.y==null?'var(--paper)':'var(--green)'}" stroke="var(--green)" stroke-width="2"/><circle cx="${X(i)}" cy="${pathPts[i][1]}" r="14" fill="transparent"><title>${esc(p.r.t.name)} — ${lab(p)}${p.r.toPar!=null&&mode==='pos'?' ('+fmt(p.r.toPar)+')':''}</title></circle>
     ${pts.length<=12?`<text x="${X(i)}" y="${H-B+16}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc((p.r.t.name||'').replace(/^The /,'').split(' ')[0])}</text>`:''}</g>`).join('')}
  </svg>`;
}

  const d=e&&e.lw!=null?e.lw-e.rank:0;
  const q=encodeURIComponent('"'+n+'" golf');
  modal(`<div class="pc-head"><div class="plc" style="gap:14px">${isComm?`<label style="position:relative;cursor:pointer" title="Upload a photo">${av(n,64)}<span style="position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px">📷</span><input type="file" accept="image/*" data-pphoto="${esc(n)}" style="display:none"></label>`:av(n,64)}<div><h2>${esc(n)}${e?.am?' <span class="badge am" style="vertical-align:middle">AMATEUR</span>':''}${isDP(n)?' <span class="badge dp" style="vertical-align:middle">DP WORLD TOUR</span>':''}${notPGA(n)&&!isDP(n)&&!rkOf(n)?.am&&!['majors','nopga'].includes(newsOf(n)?.status)?' <span class="badge bad" style="vertical-align:middle">NO PGA TOUR</span>':''}</h2><div class="muted small">${flagOf(e?.ctry)} ${esc(e?.ctry||'')}${isComm&&S.photos[slug(n)]?` · <a href="#" id="pphRm">remove photo</a>`:''}</div></div></div></div><button class="xclose" id="cClose" aria-label="Close" title="Close">✕</button>
   <div class="kpis" style="margin:14px 0">
     <div><div class="lbl">World rank</div><div class="stat">${e?'#'+e.rank:'NR'}</div><div class="small">${e&&e.lw!=null?(d>0?`<span class="mv-up">▲ ${d} from last week</span>`:d<0?`<span class="mv-dn">▼ ${-d} from last week</span>`:'No change'):''}</div></div>
     <div><div class="lbl">${t?esc(short(t.name))+' odds':'Next odds'}</div><div class="stat">${od?esc(od):'—'}</div></div>
     <div><div class="lbl">MVP pts</div><div class="stat">${m?fp(m.pts):'0'}</div></div>
   </div>
   ${(()=>{const L=lrOf(n),T=leagueRanks();
     return `<div class="kpis" style="margin:0 0 14px">
     <div><div class="lbl">League rank</div><div class="stat">${L?'#'+L.rank:'—'}</div><div class="small muted">${L?'of '+T.total:'No league events played'}</div></div>
     <div><div class="lbl">Total vs field</div><div class="stat ${L?(L.tot>0?'under':L.tot<0?'over':''):''}">${L?fmtVs(L.tot):'—'}</div><div class="small muted">${L?'strokes · '+L.ev+' event'+(L.ev===1?'':'s'):''}</div></div>
     <div><div class="lbl">Avg vs field</div><div class="stat ${L?(L.avg>0?'under':L.avg<0?'over':''):''}">${L?fmtVs(L.avg):'—'}</div><div class="small muted">${L?(L.arank?'Avg rank #'+L.arank+' of '+T.atotal:'Avg rank needs '+T.minEv+' events'):''}</div></div></div>`;})()}
   <p class="small">${o?`On <b>${esc(teamName(o))}</b>`:'<b>Free agent</b>'}</p>
   ${notPGA(n)?`<p class="small"><b>Not a PGA Tour member</b> — he isn't in the ${S.pgaInfo?.season||''} FedExCup standings or among next season's Korn Ferry / DP World Tour graduates, so he'll rarely (if ever) be in the field for league events.</p>`:''}
   ${isDP(n)?`<p class="small muted">Plays mainly on the DP World Tour (16+ starts in the ${S.dpwtInfo?.season||''} Race to Dubai), so he'll only show up in PGA Tour events now and then.${S.dpwtCard&&S.dpwtCard.has(n)?' <b>In line for a PGA Tour card next season</b> (top 10 in the Race to Dubai).':''}</p>`:''}
   ${(()=>{const lt=tcLiveTour(n),u=lt&&tcUrl(lt,n);return u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener" style="display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0 4px;text-decoration:none">📺 Watch live on TOURCast <span class="small tc-ev" style="opacity:.8">· ${esc(short(lt.name))}</span> ↗</a>`:'';})()}
   ${(()=>{const rows=playerLog(n),mode=UI.trendMode||'pos';
     const past=rows.filter(r=>r.hasScores),fut=rows.filter(r=>!r.hasScores).slice(0,4);
     const tr=r=>`<tr${r.hasScores?'':' class="dim"'}><td class="small" style="white-space:nowrap">${esc(fmtDates(r.t).replace(/, \d{4}$/,''))}</td><td>${esc(r.t.name)}${r.hasScores&&!r.fin?' <span class="badge live">Live</span>':''}${r.t.major?' <span class="badge">Major</span>':isSig(r.t)?' <span class="badge">Sig</span>':''}</td>
       <td class="num">${r.hasScores?(r.mc?'<span class="muted">MC</span>':r.pos?`${r.tied?'T':''}${r.pos}`:(r.inField===false?'<span class="muted">—</span>':'<span class="muted">DNP</span>')):(r.inField?'<span class="small">In field</span>':'<span class="muted">—</span>')}</td>
       <td class="num ${r.toPar!=null?scls(r.toPar):''}">${r.toPar!=null?fmt(r.toPar):r.mc?'<span class="muted">MC</span>':'<span class="muted">—</span>'}</td>
       <td class="small">${r.team?esc(teamName(r.team)):r.hasScores?'<span class="muted">Not started</span>':''}</td></tr>`;
     return `<h3 style="margin-top:14px">Game log</h3><div class="scroll"><table style="font-size:13px"><tr><th>Date</th><th>Event</th><th class="num">Pos</th><th class="num">To par</th><th>Started by</th></tr>${[...past,...fut].map(tr).join('')||'<tr><td colspan="5" class="muted">No league events yet.</td></tr>'}</table></div>
     <div class="row" style="justify-content:space-between;align-items:center;margin-top:14px"><h3 style="margin:0">Trend</h3><div class="row" style="gap:4px"><button class="${mode==='pos'?'':'ghost'} sm" id="trPos">Finish</button><button class="${mode==='par'?'':'ghost'} sm" id="trPar">Score to par</button></div></div>
     ${trendSvg(past,mode)}`;})()}
   <h3>News</h3>
   ${x?`<div class="notice small">${BADS[x.status]?`<span class="badge ${x.status==='hot'?'hot':'bad'}">${BADS[x.status]}</span> `:''}${esc(x.note)}${x.date?` <span class="muted">(${esc(x.date)})</span>`:''}</div>`:`<p class="small muted">No flagged news for this golfer${S.newsAt?` as of ${new Date(S.newsAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}`:''}.</p>`}
   <p class="small"><a href="https://news.google.com/search?q=${q}" target="_blank" rel="noopener">Latest headlines on Google News ↗</a></p>`);
  $('#cClose').onclick=closeModal;
  const tp=$('#trPos'),tq=$('#trPar');if(tp)tp.onclick=()=>{UI.trendMode='pos';showPlayer(n);};if(tq)tq.onclick=()=>{UI.trendMode='par';showPlayer(n);};
  const rm=$('#pphRm');if(rm)rm.onclick=async ev=>{ev.preventDefault();await w(()=>db.doc('photos/'+slug(n)).delete(),'Photo removed');closeModal();};
}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}if(f||row.length){row.push(f);rows.push(row);}return rows;}
async function importRankings(file){
  if(!isComm) return;
  let rows;try{rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));}catch(e){toast('Could not read that file');return;}
  const H=(rows[0]||[]).map(h=>h.trim().toUpperCase()),ix=n=>H.indexOf(n);
  const iR=ix('RANKING'),iN=ix('NAME'),iC=ix('CTRY'),iL=ix('LAST WEEK'),iF=ix('FIRST NAME'),iLa=ix('LAST NAME');
  if(iR<0||(iN<0&&iF<0)){toast("That doesn't look like the OWGR ranking file");return;}
  const raw=rows.slice(1).filter(r=>r.length>iR&&r[iR]&&!isNaN(+r[iR])).map(r=>({rank:+r[iR],name:(iN>=0&&r[iN]?r[iN]:((r[iF]||'')+' '+(r[iLa]||''))).trim(),ctry:iC>=0?(r[iC]||'').trim():'',lw:iL>=0&&r[iL]&&!isNaN(+r[iL])?+r[iL]:null}));
  if(!raw.length){toast('No players found in that file');return;}
  const base=s=>s.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
  const cnt={};raw.forEach(p=>{const b=slug(base(p.name));cnt[b]=(cnt[b]||0)+1;});
  const seen=new Set(),players=[];
  raw.sort((a,b)=>a.rank-b.rank).forEach(p=>{
    const am=/\(\s*am\s*\)/i.test(p.name);
    let n=cnt[slug(base(p.name))]>1?p.name.replace(/\s*\(\s*am\s*\)/ig,'').replace(/\s*\(/g,' (').replace(/\s+/g,' ').trim():base(p.name);
    if(seen.has(slug(n))) n=n+' ('+p.rank+')'; seen.add(slug(n));
    players.push([p.rank,n,p.ctry,p.lw,am?1:0]);
  });
  if(!await confirmBox(`Load <b>${players.length.toLocaleString()}</b> ranked players (No. 1: ${esc(players[0][1])})? This replaces the current ranking for everyone.`,'Load rankings')) return;
  toast('Uploading rankings…');
  const SZ=1000,n=Math.ceil(players.length/SZ);
  await w(async()=>{
    for(let i=0;i<n;i++){await db.doc('rankings/c'+i).set({players:players.slice(i*SZ,(i+1)*SZ)});await sleep(150);}
    for(const [id] of S.rk.chunks){if(+id.slice(1)>=n) await db.doc('rankings/'+id).delete();}
    await db.doc('rankings/meta').set({count:players.length,chunks:n,importedAt:Date.now(),file:file.name});
  },`Rankings loaded: ${players.length.toLocaleString()} players`);
}
function bracketSetup(N,n,g,cur,evOpts){
  const max=Math.min(8,N),nb=Math.min(max,Math.max(2,n[0]));
  const byes=8-nb>0?Math.min(nb,8-nb):0;
  const r1=[[1,8],[4,5],[3,6],[2,7]].filter(([a,b])=>a<=nb&&b<=nb).map(([a,b])=>a+' vs '+b);
  const desc=nb<=4?`Round 1 is a bye week for everyone; semifinals are 1 vs ${nb>=4?4:'bye'}, 2 vs 3.`:`Seeds 1–${byes} get a Round 1 bye. Round 1: ${r1.join(', ')}.`;
  return `<div style="border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px">
    <div class="row" style="align-items:flex-end"><label class="f">Playoff teams<select data-d="po_n1">${Array.from({length:max-1},(_,k)=>k+2).map(k=>`<option ${k===nb?'selected':''}>${k}</option>`).join('')}</select></label><span class="small muted" style="flex:1">${desc} Then 1 plays the 4/5 winner and 2 plays the 3/6 winner; the two winners meet in the final.</span></div>
    ${['Round 1','Semifinals','Championship'].map((lbl,i)=>`<label class="f" style="margin-top:8px">${lbl} event<select data-d="po_r${i+1}">${evOpts(g('r'+(i+1),cur['r'+(i+1)]))}</select></label>`).join('')}
  </div>`;
}
function playoffSetup(){
  const N=order().length,cur={...poDefaults(N),...(ST().playoffs||{})};
  const g=(k,d)=>dv('po_'+k,d);
  const en=g('enabled',cur.enabled)===true||g('enabled',cur.enabled)==='true';
  const fmt0=g('format',cur.format||'points');
  const n=[1,2,3].map(i=>Math.max(2,Math.min(N,+g('n'+i,cur['n'+i]))));
  const evOpts=sel=>`<option value="">— choose event —</option>`+allTours().map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(fmtDates(t))} · ${esc(t.name)}</option>`).join('');
  const ptsRow=(i)=>{const arr=cur['p'+i]||[];return Array.from({length:n[i-1]},(_,j)=>`<label class="f" style="align-items:center">${ord(j+1)}<input class="pts" data-d="po_p${i}_${j}" value="${esc(g('p'+i+'_'+j,arr[j]??(j===0?10:1)))}"></label>`).join('');};
  const num=(i,max)=>`<select data-d="po_n${i}">${Array.from({length:Math.max(1,max-1)},(_,k)=>k+2).map(k=>`<option ${k===n[i-1]?'selected':''}>${k}</option>`).join('')}</select>`;
  const stage=(i,title,maxTeams,extra)=>`<div style="border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:10px"><b>${title}</b>
    <div class="row" style="margin-top:8px;align-items:flex-end"><label class="f">Teams${num(i,maxTeams)}</label><label class="f" style="flex:1">Event<select data-d="po_r${i}">${evOpts(g('r'+i,cur['r'+i]))}</select></label></div>
    <div class="row" style="margin-top:8px"><span class="small muted">${extra}</span>${ptsRow(i)}</div></div>`;
  return `<div class="card"><h3>Playoffs</h3>
    <label class="row small" style="gap:6px"><input type="checkbox" data-a="poEnable" ${en?'checked':''}> Use playoffs this season</label>
    ${en?`
    <div class="row" style="margin-top:10px;gap:16px"><span class="small"><b>Format</b></span>
      <label class="row small" style="gap:6px"><input type="radio" name="pofmt" data-a="poFmt" value="points" ${fmt0!=='bracket'?'checked':''}> Points race (winner auto-advances + most points)</label>
      <label class="row small" style="gap:6px"><input type="radio" name="pofmt" data-a="poFmt" value="bracket" ${fmt0==='bracket'?'checked':''}> Bracket (head-to-head, top seeds get byes)</label></div>
    ${fmt0==='bracket'?bracketSetup(N,n,g,cur,evOpts):`
    ${stage(1,'Round 1 — regular-season top teams qualify',N,'Points:')}
    ${stage(2,'Round 2 — Round 1 winner + teams with the most points',n[0],'Points:')}
    ${stage(3,'Championship — Round 2 winner + teams with the most points; lowest score wins it all',n[1],'MVP points only:')}
    `}
    <label class="row small" style="gap:6px;margin-top:10px;${fmt0==='bracket'?'display:none':''}"><input type="checkbox" data-a="poCarry" ${(g('carry',cur.carry)!==false&&g('carry',cur.carry)!=='false')?'checked':''}> Carry regular-season points into the playoffs (otherwise everyone starts at 0)</label>
    <div class="row" style="margin-top:12px"><button data-a="savePlayoffs">Save playoffs</button><span class="small muted">Playoff events are added to the league automatically. Regular season = every league event before Round 1.</span></div>`:''}
  </div>`;
}
function moveOrder(i,d){const o=order().slice();const j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];w(()=>db.doc('league/settings').update({order:o}));}

init();
</script>
